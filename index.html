<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesión</title>

    <!-- AGREGA ICONO DE LA PÁGINA (PESTAÑA) -->
    <link rel="icon" href="./img/icon.ico" type="image/x-icon">

    <!-- FORMA 1 DE CREAR ESTILOS CON CSS -->
    <link rel="stylesheet" href="CSS/styles.css">
    
    <!-- Crea las propiedades que heredan todos por defecto todos los elementos de la página de Inicio de Sesión -->
    <style>
        body{
            background-color: white;
            font-family: "arial", sans-serif;
            color: black;
            margin: 20px;
        }

        /*Establece de forma predeterminada el tipo de fuente de la página */
        *{
            font-family: "arial", sans-serif;
        }

        /* Cambia los colores de seleccion de texto de la página*/
        ::selection{
        background: #39569c;    /*Cambia de color el fondo del texto seleccionado*/
        color: white;           /*Cambia de color el texto al hacer la selección*/
        }
    </style>
</head>

<body>
    <div class="loginContainer"> 
        <div class="imageContainer">
            <img src="img/loginImage.png" alt="login-Image">
        </div>   
        <div class="formContainer">
            <img src="img/facebookLogo.png" alt="logoFacebook">
            <br><br>
            <h3>Inicia Sesión en Facebook-Lite</h3>
            <br>
            <form>
                <input type="email" name="email" id="email" placeholder="Correo electrónico" required>
                <br><br>
                <input type="password" name="password" id="password" placeholder="Contraseña" required>
                <br><br>
                <button type="submit" id="loginButton" onclick="redirect()">Inicia sesión</button>
            </form>
            <br>
            <a href="passwordRecorver.html">
                <button type="button" id="forgotButton">¿Olvidaste tu contraseña?</button>
            </a>
        </div>
    </div>
    
    
    <br><br>
    <footer>
        All rights reserved.
    </footer>

    <script src="js/loginScript.js"></script>
</body>

</html>
